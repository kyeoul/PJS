    <body>
                <!-- The Modal -->
        <div id="myModal" class="modal">

            <!-- Modal content -->
              <div class="modal-content" id="modal-content">
                <div class="modal-header">
                  <span class="close">&times;</span>
                  <h3 id="header-text">Correct!</h3>
                </div>
                <div class="modal-body">
                    <span style="font-size: 100px; color: white;" id="modal-image">&#10003;</span>
                    <h4 id="personEliminated">You have just eliminated ...</h4>
                </div>
              </div>

        </div>

        <div class="container">
            <header>
                <div class="identity-container">
                    <h2 id="personal-id">
                        Your Identity: 
                    </h2>
                </div>
    
            </header>
    
            <section class="guess-container">
                <div class="padding-container">
                    <div class="card-container" id="card-container">
                        <div>
                            <h2 id="guess-person">
                            You are guessing -person-'s identity.
                            </h2>
                        </div>
    
                        <div class="input-container" id="input-container">
                            <label for="identity">Guess: </label>
                            <input type="text" id="guessIdentity" placeholder="Who is this person's identity?">
                        </div>
    
                        <button class="submit" id="guessButton">Submit</button>
                    </div>
                </div>
            </section>

            <section class="choice-container">
                <div class="button-container">
                    <button class="choice-button" id="player1">
                        player1
                    </button>
                </div>

                <div class="button-container">
                    <button class="choice-button" id="player2">
                        player2
                    </button>
                </div>

                <div class="button-container">
                    <button class="choice-button" id="player3">
                        player3
                    </button>
                </div>

                <div class="button-container">
                    <button class="choice-button" id="player4">
                        player4
                    </button>
                </div>

                <div class="button-container">
                    <button class="choice-button" id="player5">
                        player5
                    </button>
                </div>

                <div class="button-container">
                    <button class="choice-button" id="player6">
                        player6
                    </button>
                </div>

                <div class="button-container">
                    <button class="choice-button" id="player7">
                        player7
                    </button>
                </div>

            </section>
        </div>
